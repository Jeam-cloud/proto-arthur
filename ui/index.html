<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The Content-Security-Policy meta is injected by vite.config.js per mode:
       strict in the production build, and relaxed just enough in dev to allow
       Vite's Fast Refresh inline preamble (which only exists during `npm run
       dev`). Hard-coding a strict CSP here blocks that preamble and blanks the
       renderer — see the cspPlugin in vite.config.js. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arthur</title>
</head>
